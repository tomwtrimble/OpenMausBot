[package]
name = "queue-alert"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_System_LibraryLoader", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Graphics_Imaging", "Media_Ocr", "Globalization", "Foundation", "Foundation_Collections"] }
